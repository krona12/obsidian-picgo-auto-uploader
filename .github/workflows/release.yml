name: Release

on:
  push:
    tags:
      - "*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Audit and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Check out verified tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js without privileged cache restore
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.12.0"
          package-manager-cache: false
      - name: Install exact dependencies
        run: npm ci
      - name: Verify source and build release package
        run: npm run check
      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            release/main.js
            release/manifest.json
            release/styles.css
      - name: Preserve audited workflow artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: picgo-auto-uploader-${{ github.ref_name }}
          path: |
            release/main.js
            release/manifest.json
            release/styles.css
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
      - name: Create or reuse draft with exact assets
        id: create_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_records() {
            gh api --paginate "repos/${{ github.repository }}/releases" --slurp |
              jq -r --arg tag "$RELEASE_TAG" '.[][] | select(.tag_name == $tag) | [.id, .draft] | @tsv'
          }

          existing_release_records=$(release_records)
          existing_release_count=$(printf '%s\n' "$existing_release_records" | sed '/^$/d' | wc -l)
          if [ "$existing_release_count" -gt 1 ]; then
            echo "Found multiple releases for $RELEASE_TAG; refusing to choose one." >&2
            exit 1
          fi

          if [ "$existing_release_count" -eq 1 ]; then
            draft_release_id=$(printf '%s\n' "$existing_release_records" | cut -f1)
            existing_release_is_draft=$(printf '%s\n' "$existing_release_records" | cut -f2)
            if [ "$existing_release_is_draft" != "true" ]; then
              echo "Published release $RELEASE_TAG already exists; refusing to replace it." >&2
              exit 1
            fi
            echo "Reusing existing draft release $draft_release_id for $RELEASE_TAG."
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --latest=false --title "PicGo Auto Uploader $RELEASE_TAG" --notes-from-tag release/main.js release/manifest.json release/styles.css
            created_release_records=$(release_records)
            created_release_count=$(printf '%s\n' "$created_release_records" | sed '/^$/d' | wc -l)
            if [ "$created_release_count" -ne 1 ]; then
              echo "Expected exactly one release for $RELEASE_TAG after draft creation; found $created_release_count." >&2
              exit 1
            fi
            draft_release_id=$(printf '%s\n' "$created_release_records" | cut -f1)
            created_release_is_draft=$(printf '%s\n' "$created_release_records" | cut -f2)
            if [ "$created_release_is_draft" != "true" ]; then
              echo "Created release $draft_release_id is not a draft." >&2
              exit 1
            fi
          fi

          case "$draft_release_id" in
            *[!0-9]*|"")
              echo "Draft release ID is invalid." >&2
              exit 1
              ;;
          esac
          printf 'draft_release_id=%s\n' "$draft_release_id" >> "$GITHUB_OUTPUT"
      - name: Verify remote assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_RELEASE_ID: ${{ steps.create_release.outputs.draft_release_id }}
        run: |
          case "$DRAFT_RELEASE_ID" in
            *[!0-9]*|"")
              echo "Draft release ID is invalid." >&2
              exit 1
              ;;
          esac
          expected=$(printf '%s\n' main.js manifest.json styles.css)
          release_json=$(gh api "repos/${{ github.repository }}/releases/$DRAFT_RELEASE_ID")
          actual=$(printf '%s' "$release_json" | jq -r '.assets | map(.name) | sort | .[]')
          if [ "$actual" != "$expected" ]; then
            printf 'Unexpected remote assets.\nExpected:\n%s\nActual:\n%s\n' "$expected" "$actual" >&2
            exit 1
          fi
          expected_digests=$(
            for asset in main.js manifest.json styles.css; do
              digest=$(sha256sum "release/$asset" | cut -d ' ' -f1)
              printf '%s\tsha256:%s\n' "$asset" "$digest"
            done
          )
          actual_digests=$(printf '%s' "$release_json" | jq -r '.assets | sort_by(.name) | .[] | [.name, .digest] | @tsv')
          if [ "$actual_digests" != "$expected_digests" ]; then
            printf 'Remote asset digests do not match the audited package.\nExpected:\n%s\nActual:\n%s\n' "$expected_digests" "$actual_digests" >&2
            exit 1
          fi
          gh api --method PATCH "repos/${{ github.repository }}/releases/$DRAFT_RELEASE_ID" -F draft=false -f make_latest=true --silent
